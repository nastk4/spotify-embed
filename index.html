<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Playlist</title>
  <link rel="preload" as="image" href="label.png">
  <style>
    html, body { margin: 0; overflow: hidden; background: transparent; }

    #wrap {
      position: relative; border-radius: 12px; overflow: hidden;
      isolation: isolate; min-height: 352px;
    }
    #wrap iframe {
      display: block; border: 0;
      filter: invert(1) hue-rotate(180deg);
    }

    
    #okladka {
      position: absolute; left: 24px; top: 24px;
      width: 152px; height: 152px; border-radius: 8px;
      background: #fde3ee;
      pointer-events: none;
    }

    #plyta {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border-radius: 50%; object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      animation: obrot 9s linear infinite;
      animation-play-state: paused;
    }
    #plyta.gra { animation-play-state: running; }

    @keyframes obrot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="background:#f7cfe0; padding:10px; border-radius:20px;">
    <div id="wrap">
      <div id="embed"></div>
      <div style="position:absolute; inset:0; background:#fde3ee; mix-blend-mode:multiply; pointer-events:none;"></div>
      <div style="position:absolute; inset:0; background:rgba(255,255,255,0.4); pointer-events:none;"></div>
      <div id="okladka">
        <img id="plyta" src="label.png" alt="">
      </div>
    </div>
  </div>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script>
    window.onSpotifyIframeApiReady = function (IFrameAPI) {
      var element = document.getElementById("embed");
      var options = {
        uri: "spotify:playlist:162O07ZgoZ6xhfEstXVO4H",
        width: "100%",
        height: 352
      };
      IFrameAPI.createController(element, options, function (controller) {
        var plyta = document.getElementById("plyta");
        controller.addListener("playback_update", function (e) {
          if (e.data.isPaused) {
            plyta.classList.remove("gra");
          } else {
            plyta.classList.add("gra");
          }
        });
      });
    };
  </script>
</body>
</html>
