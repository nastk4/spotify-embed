<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Playlist 2</title>
  <link rel="preload" as="image" href="plyta2.png">
  <style>
    html, body { margin: 0; overflow: hidden; background: transparent; }

    #wrap {
      position: relative; border-radius: 12px; overflow: hidden;
      isolation: isolate; min-height: 352px;
    }
    #wrap iframe {
      display: block; border: 0;
      filter: invert(1) grayscale(1) brightness(1.5);
    }

    .pas {
      position: absolute; left: 0; right: 0;
      mix-blend-mode: multiply; pointer-events: none;
    }
    #gora  { top: 0; height: 200px; background: #f3c4d9; }
    #lista { top: 200px; bottom: 0; background: #f8d9e6; }

    #okladka {
      position: absolute; left: 24px; top: 24px;
      width: 152px; height: 152px; border-radius: 8px;
      background: #f3c4d9;
      pointer-events: none;
    }

    #plyta {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border-radius: 50%; object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      animation: obrot 9s linear infinite;
      animation-play-state: paused;
    }
    #plyta.gra { animation-play-state: running; }

    @keyframes obrot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="background:#fae9f1; padding:10px; border-radius:20px;">
    <div id="wrap">
      <div id="embed"></div>
      <div id="gora" class="pas"></div>
      <div id="lista" class="pas"></div>
      <div id="okladka">
        <img id="plyta" src="plyta2.png" alt="">
      </div>
    </div>
  </div>

  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script>
    window.onSpotifyIframeApiReady = function (IFrameAPI) {
      var element = document.getElementById("embed");
      var options = {
        uri: "spotify:playlist:071IvXTBfocXfrLh0Z5DEr",
        width: "100%",
        height: 352
      };
      IFrameAPI.createController(element, options, function (controller) {
        var plyta = document.getElementById("plyta");
        controller.addListener("playback_update", function (e) {
          if (e.data.isPaused) {
            plyta.classList.remove("gra");
          } else {
            plyta.classList.add("gra");
          }
        });
      });
    };
  </script>
</body>
</html>
